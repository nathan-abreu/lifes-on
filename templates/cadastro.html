{% extends "base_auth.html" %}

{% block titulo %}Criar Conta{% endblock %}

{% block formulario %}
<h2>Criar Conta</h2>
<p class="cartao-auth__sub">Comece a treinar com a gente hoje.</p>

<form method="POST" action="{{ url_for('cadastro') }}">
    <div class="campo">
        <label for="nome">Nome completo</label>
        <div class="campo__caixa">
            <i class="fa-solid fa-user"></i>
            <input type="text"
                   name="nome"
                   id="nome"
                   placeholder="Seu nome completo"
                   required
                   autofocus>
        </div>
    </div>

    <div class="campo">
        <label for="email">E-mail</label>
        <div class="campo__caixa">
            <i class="fa-solid fa-envelope"></i>
            <input type="email"
                   name="email"
                   id="email"
                   placeholder="seu@email.com"
                   required>
        </div>
    </div>

    <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo__caixa">
            <i class="fa-solid fa-lock"></i>
            <input type="password"
                   name="senha"
                   id="senha"
                   placeholder="••••••••"
                   required
                   minlength="6">
            <button type="button" class="olho" data-olho="senha" aria-label="Mostrar senha">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>
        <small class="campo__ajuda">Mínimo 6 caracteres</small>
    </div>

    <button type="submit" class="botao-verde">Criar Conta</button>
</form>

<p class="rodape-auth">
    Já tem uma conta? <a href="{{ url_for('login') }}">Faça login</a>
</p>
{% endblock %}
