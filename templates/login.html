{% extends "base_auth.html" %}

{% block titulo %}Entrar{% endblock %}

{% block formulario %}
<h2>Entrar</h2>
<p class="cartao-auth__sub">Bem-vindo de volta!</p>

<form method="POST" action="{{ url_for('login') }}">
    <div class="campo">
        <label for="email">E-mail</label>
        <div class="campo__caixa">
            <i class="fa-solid fa-envelope"></i>
            <input type="email"
                   name="email"
                   id="email"
                   placeholder="seu@email.com"
                   required
                   autofocus>
        </div>
    </div>

    <div class="campo">
        <label for="senha">Senha</label>
        <div class="campo__caixa">
            <i class="fa-solid fa-lock"></i>
            <input type="password"
                   name="senha"
                   id="senha"
                   placeholder="••••••••"
                   required>
            <button type="button" class="olho" data-olho="senha" aria-label="Mostrar senha">
                <i class="fa-solid fa-eye"></i>
            </button>
        </div>
    </div>

    <p class="esqueci"><a href="#">Esqueci minha senha</a></p>

    <button type="submit" class="botao-verde">Entrar</button>
</form>

<p class="rodape-auth">
    Não tem uma conta? <a href="{{ url_for('cadastro') }}">Criar Conta</a>
</p>
{% endblock %}
