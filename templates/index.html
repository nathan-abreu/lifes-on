<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lifes On - Sua Jornada Fitness</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome (ícones) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #439472, #324937, #1d352e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }
        
        /* Partículas de fundo animadas */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(40, 167, 69, 0.3);
            border-radius: 50%;
            animation: float linear infinite;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1);
                opacity: 0;
            }
        }
        
        .hero-section {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
        }
        
        .hero-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 4rem 3.5rem;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: fadeInUp 0.8s ease;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .logo-icon {
            font-size: 4rem;
            color: #28a745;
            background: rgba(40, 167, 69, 0.1);
            padding: 24px;
            border-radius: 50%;
            display: inline-block;
        }
        
        .btn-hero-primary {
            background: #28a745;
            border: none;
            padding: 14px 40px;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 50px;
            transition: all 0.3s;
        }
        
        .btn-hero-primary:hover {
            background: #218838;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.4);
        }
        
        .btn-hero-secondary {
            background: transparent;
            border: 2px solid #28a745;
            color: #28a745;
            padding: 14px 40px;
            font-weight: 600;
            font-size: 1.05rem;
            border-radius: 50px;
            transition: all 0.3s;
        }
        
        .btn-hero-secondary:hover {
            background: #28a745;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(40, 167, 69, 0.3);
        }
        
        .feature-icon {
            width: 60px;
            height: 60px;
            background: rgba(40, 167, 69, 0.1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #28a745;
            margin: 0 auto 15px;
            transition: all 0.3s;
        }
        
        .feature-item:hover .feature-icon {
            transform: scale(1.1) rotate(-5deg);
            background: rgba(40, 167, 69, 0.2);
        }
        
        .feature-item h6 {
            font-weight: 700;
            color: #0f0c29;
        }
        
        .feature-item p {
            font-size: 0.9rem;
            color: #6c757d;
        }
        
        @media (max-width: 768px) {
            .hero-card {
                padding: 2.5rem 1.5rem;
            }
            
            .logo-icon {
                font-size: 3rem;
                padding: 18px;
            }
            
            .btn-hero-primary,
            .btn-hero-secondary {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Partículas de fundo -->
    <div class="bg-particles" id="particles"></div>

    <section class="hero-section">
        <div class="hero-card">
            <div class="row align-items-center">
                <div class="col-lg-7 text-center text-lg-start">
                    <div class="mb-3">
                        <span class="logo-icon">
                            <i class="fas fa-dumbbell"></i>
                        </span>
                    </div>
                    
                    <h1 class="display-3 fw-bold" style="color: #0f0c29;">
                        Lifes <span style="color: #28a745;">On</span>
                    </h1>
                    <p class="lead text-muted mb-4" style="font-size: 1.2rem;">
                        Organize seus treinos, acompanhe seu progresso e alcance suas metas fitness com a ajuda da tecnologia.
                    </p>
                    
                    <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-lg-start">
                        <a href="{{ url_for('login') }}" class="btn btn-hero-primary text-white">
                            <i class="fas fa-sign-in-alt me-2"></i>Entrar
                        </a>
                        <a href="{{ url_for('cadastro') }}" class="btn btn-hero-secondary">
                            <i class="fas fa-user-plus me-2"></i>Criar Conta
                        </a>
                    </div>
                </div>
                
                <div class="col-lg-5 mt-5 mt-lg-0">
                    <div class="row g-3">
                        <div class="col-6">
                            <div class="feature-item text-center p-3 rounded-4" style="background: #f8f9fa;">
                                <div class="feature-icon">
                                    <i class="fas fa-running"></i>
                                </div>
                                <h6>Registre Treinos</h6>
                                <p>Anote cada exercício</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="feature-item text-center p-3 rounded-4" style="background: #f8f9fa;">
                                <div class="feature-icon">
                                    <i class="fas fa-bullseye"></i>
                                </div>
                                <h6>Metas Pessoais</h6>
                                <p>Defina e alcance</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="feature-item text-center p-3 rounded-4" style="background: #f8f9fa;">
                                <div class="feature-icon">
                                    <i class="fas fa-chart-line"></i>
                                </div>
                                <h6>Progresso</h6>
                                <p>Acompanhe evolução</p>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="feature-item text-center p-3 rounded-4" style="background: #f8f9fa;">
                                <div class="feature-icon">
                                    <i class="fas fa-trophy"></i>
                                </div>
                                <h6>Conquistas</h6>
                                <p>Ganhe recompensas</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Script para gerar partículas -->
    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            const count = 30;
            
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 15 + 10) + 's';
                particle.style.animationDelay = (Math.random() * 15) + 's';
                
                const colors = ['rgba(40,167,69,0.2)', 'rgba(40,167,69,0.3)', 'rgba(40,167,69,0.15)'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                
                container.appendChild(particle);
            }
        }
        
        createParticles();
    </script>
</body>
</html>
